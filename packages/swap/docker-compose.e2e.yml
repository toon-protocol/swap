### swap#104 — optional Solana / Mina infra for the Docker cross-chain E2E harness.
#
# The EVM leg needs NO Docker: `pnpm --filter @toon-protocol/swap
# test:e2e:docker` boots its own Anvil + Nostr relay + peer1 in-process
# (`tests/e2e/global-setup.ts`), requiring only `anvil` on PATH (devbox-pinned
# — see repo `devbox.json`).
#
# Solana and Mina are NOT vendored the same way — there is no equivalent
# lightweight in-process validator/lightnet, so this compose file provides
# them as real services. Bring them up with `./scripts/sdk-e2e-infra.sh up`
# (see that script for the env vars to export afterward), and tear down with
# `./scripts/sdk-e2e-infra.sh down`.
#
# Image tags are best-effort defaults — pin/update them for your environment
# if a pull fails; nothing in `tests/e2e/helpers/infra-gate.ts` depends on
# the specific tag, only on the ports below.

services:
  solana-test-validator:
    image: solanalabs/solana:v1.18.26
    command:
      - solana-test-validator
      - --rpc-port
      - "19899"
      - --gossip-host
      - "127.0.0.1"
      - --reset
    ports:
      - "19899:19899"
      - "19900:19900" # websocket (RPC port + 1, Solana convention)
    healthcheck:
      test: ["CMD-SHELL", "solana cluster-version --url http://127.0.0.1:19899 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mina-lightnet:
    image: o1labs/mina-local-network:rampup-latest-lightnet
    environment:
      NETWORK_TYPE: "single-node"
    ports:
      - "19085:8080"  # GraphQL
      - "19086:8181"  # accounts-manager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/graphql -X POST -H 'content-type: application/json' -d '{\"query\":\"{syncStatus}\"}' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
