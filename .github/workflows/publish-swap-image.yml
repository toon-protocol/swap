name: Publish swap image

# Publishes the runtime maker-node image (deploy/swap/Dockerfile, issue #124)
# to GHCR as ghcr.io/toon-protocol/swap, tagged `sha-<short-sha>` (immutable,
# content-pinned) and `main` (floating, default-branch only). Mirrors
# connector's publish-connector-rust-image.yml. This is swap's first-ever
# published artifact of any kind — the npm package itself is not yet
# published (see CLAUDE.md "Publishing"; that stays a separate
# changesets-driven release.yml flow, untouched here).

on:
  push:
    branches:
      - main
    paths:
      - 'packages/swap/src/**'
      - 'packages/swap/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - 'deploy/swap/Dockerfile'
      - '.github/workflows/publish-swap-image.yml'
  workflow_dispatch: {}

concurrency:
  group: publish-swap-image
  # Only the newest content-addressed build is ever wanted (see connector's
  # equivalent workflow) — an older run's `sha-` tag can be rebuilt on that
  # commit via `workflow_dispatch` if it's ever needed after being cancelled.
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/swap

jobs:
  build-and-push:
    name: Build and push swap image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push swap image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/swap/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # GHCR defaults a new container package to PRIVATE regardless of the
      # linked repo's visibility — make it public so a deployment (the
      # connector-infra side of toon-meta#402) can `docker pull` unauthenticated.
      # Idempotent.
      - name: Set container package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/swap" \
            -f visibility=public \
            && echo "✓ Package visibility set to public" \
            || echo "::warning::Could not set package visibility — may need manual fix in GHCR UI"

      # Post-publish, not an assertion: pulls the tag just pushed and shows its
      # actual stdout/stderr. The CLI refuses to boot without a mounted config
      # (readFileSync on a missing --config path) — this proves that refusal
      # against the real published artifact, mirroring connector's ADR 0009
      # verification step.
      - name: Verify image refuses to start without a mounted config
        run: |
          set +e
          OUTPUT=$(docker run --rm "${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}" 2>&1)
          STATUS=$?
          set -e
          echo "----- container output -----"
          echo "$OUTPUT"
          echo "----- exit code: $STATUS -----"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::swap image started with no config mounted — expected a refusal"
            exit 1
          fi
          echo "✓ Refused to start without a config, as expected"

      - name: Publish summary
        run: |
          {
            echo "## swap image published"
            echo ""
            echo "**Image:** \`${{ env.IMAGE }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
