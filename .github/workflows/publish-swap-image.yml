name: Publish swap image

# Publishes the runtime maker-node image (deploy/swap/Dockerfile, issue #124)
# to GHCR as ghcr.io/toon-protocol/swap, tagged `sha-<short-sha>` (immutable,
# content-pinned), `main` (floating, default-branch only), and `release`
# (floating, default-branch only — the Watchtower watch target on the relay
# box; moves only on a merge to main that passed this workflow's own gate,
# see toon-meta#403 and issue #131). Mirrors connector's
# publish-connector-rust-image.yml. This is swap's first-ever published
# artifact of any kind — the npm package itself is not yet published (see
# CLAUDE.md "Publishing"; that stays a separate changesets-driven release.yml
# flow, untouched here).

on:
  push:
    branches:
      - main
    # Every input the image build actually reads: the sources and manifests
    # the Dockerfile COPYs, the build config that shapes `dist/`, and the
    # `.dockerignore` that decides what reaches the build context.
    paths:
      - 'packages/swap/src/**'
      - 'packages/swap/package.json'
      - 'packages/swap/tsconfig.json'
      - 'packages/swap/tsup.config.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - '.npmrc'
      - '.dockerignore'
      - 'deploy/swap/Dockerfile'
      - '.github/workflows/publish-swap-image.yml'
  workflow_dispatch: {}

concurrency:
  group: publish-swap-image
  # Only the newest content-addressed build is ever wanted (see connector's
  # equivalent workflow) — an older run's `sha-` tag can be rebuilt on that
  # commit via `workflow_dispatch` if it's ever needed after being cancelled.
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/swap

jobs:
  build-and-push:
    name: Build and push swap image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=release,enable={{is_default_branch}}

      - name: Build and push swap image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/swap/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # GHCR defaults a new container package to PRIVATE regardless of the
      # linked repo's visibility — make it public so a deployment (the
      # connector-infra side of toon-meta#402) can `docker pull` unauthenticated.
      # Idempotent.
      - name: Set container package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/swap" \
            -f visibility=public \
            && echo "✓ Package visibility set to public" \
            || echo "::warning::Could not set package visibility — may need manual fix in GHCR UI"

      # Post-publish proof against the REAL published artifact (the build
      # pushed straight from buildx, so this `docker run` pulls the tag back
      # down — which also proves it is pullable). The CLI refuses to boot
      # without a mounted config (readFileSync on a missing --config path);
      # mirrors connector's ADR 0009 verification step and ci.yml's
      # pre-merge copy of the same check. Grepping for the entrypoint's own
      # `[swap-node] Startup error:` log asserts THAT failure mode rather
      # than any nonzero exit — an unpullable or non-runnable image would
      # satisfy a bare exit-code check vacuously.
      - name: Verify image refuses to start without a mounted config
        run: |
          set +e
          OUTPUT=$(docker run --rm "${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}" 2>&1)
          STATUS=$?
          set -e
          echo "----- container output -----"
          echo "$OUTPUT"
          echo "----- exit code: $STATUS -----"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::swap image started with no config mounted — expected a refusal"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q '\[swap-node\] Startup error'; then
            echo "::error::published image did not fail with the expected startup error (got a different failure, e.g. the image could not be pulled or run) — output above"
            exit 1
          fi
          echo "✓ Refused to start without a config, as expected"

      - name: Publish summary
        run: |
          {
            echo "## swap image published"
            echo ""
            echo "**Image:** \`${{ env.IMAGE }}\`"
            echo ""
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
