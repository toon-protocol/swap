name: Agent image

# Minimal build-only check for the sandcastle agent container image.
# Proves the `.sandcastle/Dockerfile` (node:22-bookworm + gh + pnpm via corepack +
# Claude Code CLI + the mattpocock-skills plugin) builds. This is not the
# runner itself; that is agent-implement.yml.

on:
  pull_request:
    paths:
      - '.sandcastle/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:

jobs:
  build-image:
    name: Build sandcastle agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Docker is preinstalled on ubuntu-latest GitHub-hosted runners.
      # `sandcastle docker build-image` builds .sandcastle/Dockerfile,
      # defaulting the AGENT_UID/AGENT_GID build args to the runner's uid/gid.
      - name: Build agent image
        run: npx --yes @ai-hero/sandcastle@0.12.0 docker build-image

      - name: Verify toolchain inside image
        run: |
          docker run --rm --entrypoint bash sandcastle:swap -lc '
            set -e
            node --version
            gh --version | head -1
            # swap is a pnpm workspace; pnpm resolves via corepack, and the
            # mounted repo pins pnpm@8.15.9 through its packageManager field.
            pnpm --version
            python3 --version
            g++ --version | head -1
            test "$(whoami)" = "agent"
            test -x /home/agent/.local/bin/claude
            # The runner starts every session with a mattpocock-skills slash command.
            claude plugin list | grep -q mattpocock-skills
          '
