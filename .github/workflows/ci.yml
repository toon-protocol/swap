name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Changeset gate (swap#168), ported from toon-client#612 / rig#110 plus a
  # third step this repo needs and neither of those has.
  #
  # Until now NOTHING in `.github/` read a changeset except `release.yml`, which
  # runs after merge where its failure gates nothing. What that cost is swap#168:
  # 22 of the 26 pending changesets on `main` had EMPTY frontmatter, ~13 of them
  # describing shipped behaviour of the published package — the v2 EIP-712
  # digest, the leg-B return path, the `cli.ts` fix that made every log line in
  # the released image a no-op — and `@toon-protocol/swap` sat on npm at 2.1.0
  # for five weeks while `swap:release` moved. The Docker image is a separate
  # artifact and did carry all of it; only npm consumers were short-changed.
  #
  # `if: github.event_name == 'pull_request'` is a real skip, not an oversight —
  # a push to `main` happens after merge, where there is nothing left to gate —
  # and `ci-ok` therefore accepts `skipped` from THIS job on push events ONLY.
  # A bare `needs:` would block nothing (toon-meta#279, toon#216): a skipped
  # required check reads as a pass, so the skip has to be paired with the reason
  # it is legitimate. Every other job in this workflow is unconditional, which is
  # why `ci-ok` can keep checking those against a flat `!= success`.
  changeset:
    name: Changeset check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changeset when the publishable package changes
        run: |
          # `@toon-protocol/swap` is the only publishable package in the repo
          # (`packages/swap`, not `private`, and `.changeset/config.json` has an
          # empty `ignore`). deploy/, infra and .sandcastle publish nothing.
          PUBLISHABLE="packages/swap"
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          needs_changeset=false
          for pkg in $PUBLISHABLE; do
            if echo "$changed" | grep -q "^${pkg}/"; then
              needs_changeset=true
              break
            fi
          done
          if [ "$needs_changeset" = "true" ]; then
            new_changesets=$(echo "$changed" | grep -c "^\.changeset/.*\.md$" || true)
            if [ "$new_changesets" -eq 0 ]; then
              echo "::error::This PR modifies a publishable package but includes no changeset."
              echo "Run 'pnpm changeset' and commit the generated .changeset/*.md file."
              exit 1
            fi
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # Neither of the steps around this one would have caught swap#168.
      # `changeset version` accepts an empty changeset without complaint — it is
      # what `changeset add --empty` produces and the right shape for a CI-only
      # change — and the file-exists step above is satisfied by one. So "empty"
      # carried no signal, and 22 files accumulated over five weeks.
      #
      # This step does not ban empty; 9 of those 26 genuinely release nothing.
      # It requires empty to be SAID, with a `changeset:no-release` marker in the
      # body naming what does not ship. An author can still mark a behavioural
      # change no-release and be wrong — no static check reads prose — but they
      # can no longer do it by leaving a template untouched, which is how all 22
      # happened.
      #
      # Runs BEFORE `changeset version`, which consumes and deletes every
      # changeset file: after it there would be nothing left to read, and a
      # malformed frontmatter gets a message naming the file here rather than a
      # changesets stack trace there.
      #
      # Rationale and the rule itself: .sandcastle/scripts/changeset-lib.ts. Unit
      # tested in changeset-lib.test.ts, which `pnpm test` runs in the `build`
      # job — including an assertion that this repo's own pending changesets
      # satisfy the rule, so the regression stays caught even if this job is
      # edited away.
      - name: Every changeset must release something, or say why not
        run: npx tsx .sandcastle/scripts/changeset-check.ts .changeset

      # `changeset version` rather than `changeset status`: it is the
      # byte-identical command `release.yml` hands `changesets/action` as its
      # `version:` input (release.yml line ~68), so green here means the release
      # gets past versioning, with no second implementation to drift. `status`
      # additionally resolves `baseBranch` through git and errors when IT decides
      # packages changed with no changeset — duplicating the step above with a
      # different definition of "changed".
      #
      # Mutating the tree is free: this is a throwaway checkout that commits,
      # pushes and publishes nothing, and has no step after the next one. The
      # bumps it writes are PRINTED rather than discarded, because "what version
      # would this release cut" is the useful half of the output — and it is
      # exactly the number swap#168 was about.
      #
      # Unlike toon-client and rig, this repo's `.changeset/config.json` has
      # `"ignore": []`, so the specific toon-client#611 failure (a changeset
      # naming both an ignored and a non-ignored package) cannot occur here yet.
      # This step still catches an unknown package name, unparseable YAML, and an
      # `ignore` list the day someone adds one.
      - name: Assert the changesets form a valid release plan
        run: |
          set -euo pipefail
          pnpm changeset version
          echo "--- the release plan this PR would produce ---"
          git --no-pager diff --stat
          git --no-pager diff -- '**/package.json' | grep -E '^[+-]  "version"' || true
          echo "✅ changeset version succeeds — release.yml can get past versioning"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # gate:correctness builds, then runs eslint + typecheck and fails only
      # on violations beyond the frozen `.sandcastle/gate-baseline.json`
      # allowlist (swap#77). Replaces the old soft-gated `pnpm lint
      # continue-on-error: true` (a false-PASS hole — lint errors could never
      # fail CI) and adds typecheck to CI for the first time (previously
      # absent entirely).
      - run: pnpm run gate:correctness

      # Root `pnpm test` (not `pnpm -r test`) so the run picks up
      # vitest.config.ts's canonical include list, which covers both
      # packages/*/src/**/*.test.ts and .sandcastle/scripts/**/*.test.ts —
      # `pnpm -r test` would resolve packages/swap's own vitest.config.ts
      # instead and silently skip the .sandcastle gate-lib tests.
      - run: pnpm test

  devbox-validate:
    name: Devbox Environment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Assert tool versions
        run: |
          cat > "${RUNNER_TEMP:-/tmp}/assert-versions.sh" <<'ASSERT'
          set -euo pipefail
          node --version | grep -E '^v22\.'
          pnpm --version | grep -E '^8\.15\.'
          forge --version
          cast --version
          anvil --version
          ASSERT
          devbox run -- bash "${RUNNER_TEMP:-/tmp}/assert-versions.sh"
          echo "✅ All devbox tools resolved at expected versions"

      - name: Smoke build
        run: devbox run -- bash -c "pnpm install --no-frozen-lockfile && pnpm build"

      # The unit suite under the pinned toolchain. The cross-chain e2e (a real
      # Rust connector + anvil + solana-test-validator) is the `solana-e2e` job.
      - name: Unit tests
        run: devbox run -- bash -c "pnpm --filter @toon-protocol/swap test"

  # ---------------------------------------------------------------------------
  # swap#160 — the Solana E2E suites, actually executing.
  #
  # A SEPARATE job rather than more steps on `devbox-validate`, for two reasons:
  #
  #  * wall clock. Measured on this workflow's own runs, the critical path is
  #    `swap runtime image build` at ~3m43s, with `devbox-validate` at ~1m45s
  #    and `build` at ~1m7s. This job measures ~2m30s (≈40s Solana CLI install
  #    on a cold cache, ≈8s validator boot + SPL mint + 8 real channel PDAs,
  #    ~90s of e2e suites), so it runs entirely inside the shadow of the image
  #    build and adds NOTHING to pipeline wall time as long as that stays the
  #    critical path. It is not free, it is concurrent — if the image build ever
  #    gets faster than ~2m30s, this becomes the critical path and the pipeline
  #    grows to match it.
  #  * diagnosability. A red `solana-e2e` next to a green `devbox-validate`
  #    localizes the failure to the Solana leg immediately, instead of turning
  #    the one job that gates everything into a job with two unrelated reasons
  #    to fail.
  #
  # The whole point is `SWAP_E2E_REQUIRE_SOLANA=1`: it turns "Solana not ready"
  # from a skip into a hard failure (`infra-gate.ts`'s `skipIfNotReady`). Without
  # it this job could report success having run nothing — which is the exact
  # defect swap#106 found (four suites collecting zero tests, reporting a pass)
  # and the reason these suites needed rescuing in the first place.
  solana-e2e:
    name: Cross-chain E2E (relay-mediated, EVM↔Solana)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # anvil for the EVM half: leg A is paid on the vendored-fixture Anvil and
      # `global-setup.ts` will not bring peer1 up without it, so this job needs
      # foundry every bit as much as it needs Solana. Pinned to the same 1.7.1
      # `devbox.json` pins, so both jobs exercise the same anvil, and via the
      # same action + GITHUB_TOKEN workaround connector's gate uses (foundryup
      # curls api.github.com unauthenticated and gets 403 on a rate-limited
      # runner IP).
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Restored BEFORE the installer so a warm cache skips the download
      # entirely. Keyed on the exact version — a version bump must miss.
      - name: Cache Solana CLI
        id: solana-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-cli-${{ runner.os }}-v2.1.21

      # v2.1.21, NOT the v3.x line, and this is load-bearing rather than
      # conservatism: v3's `solana-test-validator` hard-requires io_uring, which
      # is unavailable under some sandboxed runners (connector's gate pins the
      # same version for exactly this reason, and documents the
      # `assertion failed: io_uring_supported()` panic). It also matches the
      # `=2.1.0` solana-program pin the vendored `payment_channel.so` was built
      # against, so the CLI driving the program is from the release line the
      # program was compiled for.
      - name: Install Solana CLI
        if: steps.solana-cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"

      - name: Put Solana CLI on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # Fail here, with a clear message, rather than 90s later inside a test:
      # every binary `global-setup.ts` needs must be present and runnable.
      - name: Assert Solana toolchain
        run: |
          solana --version
          solana-test-validator --version
          spl-token --version
          anvil --version

      - run: pnpm install --no-frozen-lockfile

      # SWAP_E2E_REQUIRE_SOLANA makes a Solana skip a failure. The suite counts
      # below are asserted afterwards because a *passing* run that collected
      # fewer tests than it should is the failure mode this repo has been bitten
      # by twice — a green tick is not evidence that anything ran.
      # Both swap parties pay the relay's Rust connector for every write, so
      # the e2e runs one (fronting a real `@toon-protocol/relay`): the
      # published immutable build this repo pins (connector ADR 0068 — never
      # `rust-main` / `rust-release`). Bump deliberately, with the connector's
      # release notes in hand; tests/e2e/helpers/rust-connector.ts is what
      # runs it (`docker run --rm --network host`).
      - name: Pull the Rust connector image
        run: docker pull ghcr.io/toon-protocol/connector:rust-sha-5c1b222
      - name: Cross-chain E2E through a real relay (EVM↔Solana, both ways)
        env:
          SWAP_E2E_CONNECTOR_IMAGE: ghcr.io/toon-protocol/connector:rust-sha-5c1b222
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: pnpm --filter @toon-protocol/swap test:e2e 2>&1 | tee /tmp/solana-e2e.log

      # Guard the count, not just the colour. `tests/e2e/README.md` documents
      # what this suite collects; it must collect its full complement with
      # NOTHING skipped. A suite that quietly loses a test, or skips one,
      # fails here. swap#154 (toon-meta#411 Stage 5) deleted the legacy
      # `docker-swap-flow-solana-e2e.test.ts` this used to check alongside it.
      - name: Assert both e2e suites collected and ran everything
        run: |
          set -euo pipefail
          # Strip any ANSI escapes before matching. Vitest's own markers sit
          # INSIDE them (`✓<ESC>[39m tests/…`, `(<ESC>[2m4 tests<ESC>[22m)`), so
          # a naive grep for "✓ tests/e2e/x" or "(4 tests)" misses a line that
          # is plainly there — which is exactly how this guard first failed.
          sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/solana-e2e.log > /tmp/solana-e2e.plain
          fail=0
          check() {
            local file="$1" expected="$2"
            local line
            # Match on the path, not the status glyph: a failing suite must
            # still be FOUND here so the count check reports the real problem
            # rather than "did not appear at all".
            line=$(grep -E "tests/e2e/${file} +\(" /tmp/solana-e2e.plain | tail -1 || true)
            if [ -z "$line" ]; then
              echo "::error::${file} did not appear in the vitest output at all"
              fail=1
              return
            fi
            echo "  ${line}"
            if ! echo "$line" | grep -qE "\(${expected} tests\)"; then
              echo "::error::${file} did not report exactly ${expected} collected tests with none skipped — see the line above"
              fail=1
            fi
          }
          check 'relay-swap.e2e.test.ts' 5
          check 'taker-toolkit.selfcheck.test.ts' 12
          [ "$fail" -eq 0 ] || exit 1
          echo "✓ both e2e suites collected and ran their full complement"

  swap-image-build:
    name: swap runtime image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only (no push, no registry login) — validates
      # deploy/swap/Dockerfile (issue #124) on every PR/push, ahead of and
      # independently from publish-swap-image.yml's build-AND-push run on
      # main. `load: true` is required on the default docker-container buildx
      # driver: without it the build result lands in the buildx cache only,
      # never the local daemon, so the boot-refusal check below would fail on
      # "Unable to find image" rather than actually exercising the image.
      - name: Build swap runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/swap/Dockerfile
          push: false
          load: true
          tags: swap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Same refusal-to-start check publish-swap-image.yml runs post-publish —
      # here it catches a Dockerfile/CLI regression before it ever reaches
      # main, instead of only after a push. Asserts the ACTUAL failure mode
      # (cli.ts's readFileSync on the missing --config path, caught and
      # logged by the entrypoint's top-level catch — see cli.ts's
      # `[swap-node] Startup error:` log) rather than just a nonzero exit,
      # which a missing-image `docker run` error would satisfy vacuously.
      - name: Verify image refuses to start without a mounted config
        run: |
          set +e
          OUTPUT=$(docker run --rm swap:ci 2>&1)
          STATUS=$?
          set -e
          echo "----- container output -----"
          echo "$OUTPUT"
          echo "----- exit code: $STATUS -----"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::swap image started with no config mounted — expected a refusal"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q '\[swap-node\] Startup error'; then
            echo "::error::container did not fail with the expected startup error (got a different failure, e.g. the image itself failed to run) — output above"
            exit 1
          fi
          echo "✓ Refused to start without a config, as expected"

      # ── The fleet-config gate, asked BEFORE the merge (connector ADR 0041) ─
      # publish-swap-image.yml runs this same gate on `main`, as the last thing
      # standing between a build and `:release` moving. That gate is correct
      # and stays exactly as it is — it is the one that blocked a real outage.
      # What it cannot do is tell an author anything, because it only speaks
      # after the merge.
      #
      # 2026-08-16, the day after the gate landed: #139 and #140 both merged,
      # both failed to publish with
      #
      #   this build REFUSES the fleet's committed swap.config.json —
      #   [INVALID_CONFIG] SwapNodeConfig.chainProviders[0].tokenNetworkAddress
      #   MUST be a non-empty string
      #   :release was NOT moved.
      #
      # because the matching connector-side config change was still sitting in
      # an unmerged PR. Two failed publishes and a manual re-run, for an
      # ordering constraint nothing had ever stated: the maker's config lives
      # in `toon-protocol/connector` (`infra/linode-relay/swap.config.json`,
      # bind-mounted on the relay box) and the code that requires it lives
      # here, so **config first, code second** — a newly-REQUIRED key must be
      # committed there before the code requiring it merges here.
      #
      # This step is that rule, enforced at the only moment the author can
      # still act on it. Same question, same image, same config, same failure
      # text as the publish gate — moved from "after the merge, against the
      # pushed image" to "on the PR, against the image this PR builds". It
      # WEAKENS NOTHING: `:release` is still moved only by the publish-time
      # gate, which re-asks everything from scratch on `main`.
      #
      # Deliberately blocking, not advisory: it is inside the `CI OK` aggregate
      # (this repo's single required context), so an ordering violation cannot
      # merge. A red here is honest — it means either this PR needs a connector
      # PR merged first, or the fleet's committed config can no longer boot
      # this repo's code, and in the second case every swap PR SHOULD be red
      # until someone fixes it.
      #
      # Keep in step with publish-swap-image.yml's "Image must still boot the
      # fleet's committed maker config" step — same deliberate mirroring as the
      # refusal check above. If the two ever disagree, the publish one wins.
      - name: Check out the fleet's committed maker config
        uses: actions/checkout@v4
        with:
          repository: toon-protocol/connector
          # Public repo — the default GITHUB_TOKEN reaches it, no write scope of
          # any kind. `main` deliberately, not a pin: the question is whether
          # this build can run what the fleet has NOW.
          ref: main
          path: fleet-config
          sparse-checkout: |
            infra/linode-relay/swap.config.json
          sparse-checkout-cone-mode: false

      - name: This build must still boot the fleet's committed maker config
        run: |
          set -uo pipefail
          CONFIG=fleet-config/infra/linode-relay/swap.config.json

          if [ ! -f "$CONFIG" ]; then
            echo "::error::could not read the fleet's committed maker config at $CONFIG."
            echo "::error::If it moved, update this step AND publish-swap-image.yml — do NOT delete the gate (connector ADR 0041)."
            exit 1
          fi

          # `validateConfig` runs before the node allocates anything, so an
          # incompatible config exits in about a second. A COMPATIBLE one goes
          # on to open sockets and dial a relay and would run forever — hence
          # the timeout, and surviving it IS the pass. The question is "was
          # this config refused", not "does this node work".
          #
          # The file alone is not what the box runs: the relay box's service is
          # this config PLUS the environment from
          # `infra/linode-relay/docker-compose.relay.swap.yml`. In particular
          # SWAP_AUTOGEN_IDENTITY=1, without which the file alone fails
          # `[INVALID_CONFIG] SwapNodeConfig: one of mnemonic or secretKey is
          # required` (#127 made the maker self-generate and persist its own
          # mnemonic to `statePath`). So reproduce the SERVICE, not the file.
          STATE=$(mktemp -d)
          chmod 777 "$STATE"
          set +e
          OUTPUT=$(timeout 45 docker run --rm \
            -v "$PWD/$CONFIG":/app/config/swap.config.json:ro \
            -v "$STATE":/app/state \
            -e SWAP_AUTOGEN_IDENTITY=1 \
            swap:ci 2>&1)
          STATUS=$?
          set -e

          echo "----- container output -----"
          echo "$OUTPUT"
          echo "----- exit code: $STATUS -----"

          if [ "$STATUS" -eq 124 ]; then
            echo "✓ the fleet's committed swap.config.json still boots this build"
            exit 0
          fi

          # Grep for the node's own name for "this config does not satisfy my
          # schema" rather than trusting a bare nonzero exit, so an unrelated
          # failure (an unreachable RPC from this runner, say) is not
          # misreported as a config break and does not redden an innocent PR.
          if echo "$OUTPUT" | grep -q 'INVALID_CONFIG'; then
            REASON=$(echo "$OUTPUT" | grep -o 'INVALID_CONFIG[^"]*' | head -1)
            {
              echo "## ❌ This build refuses the fleet's committed maker config"
              echo ""
              echo "\`$REASON\`"
              echo ""
              echo "**The config lives in another repo, and it has to change first.** The relay box"
              echo "bind-mounts \`infra/linode-relay/swap.config.json\` from"
              echo "[\`toon-protocol/connector\`](https://github.com/toon-protocol/connector/blob/main/infra/linode-relay/swap.config.json)."
              echo "This branch cannot read what is committed there, so merging it would leave"
              echo "\`:release\` unmovable — the publish gate on \`main\` will refuse it (connector ADR 0041),"
              echo "which is exactly what happened to #139 and #140."
              echo ""
              echo "**Config first, code second.** To land this change:"
              echo ""
              echo "1. Add the setting to \`infra/linode-relay/swap.config.json\` in \`toon-protocol/connector\` and **merge that PR first**."
              echo "2. Apply it to the box: \`gh workflow run fleet-ops.yml -f box=relay -f operation=config-apply -f apply=true\` (connector repo)."
              echo "3. Re-run this check here — it reads connector \`main\`, so it goes green as soon as step 1 lands."
              echo ""
              echo "Or make the setting **optional with a safe default**, which needs no cross-repo"
              echo "coordination at all and is the better answer whenever it is available."
              echo ""
              echo "This is the same gate \`publish-swap-image.yml\` runs before moving \`:release\`,"
              echo "asked early enough that you can still do something about it. It is not skippable"
              echo "here and it is not skippable there."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::this build REFUSES the fleet's committed swap.config.json — $REASON"
            echo "::error::The fix probably belongs in toon-protocol/connector FIRST: infra/linode-relay/swap.config.json. Config first, code second. See the job summary."
            exit 1
          fi

          echo "::warning::the fleet config did not reach a running state on this build (exit $STATUS), but not with INVALID_CONFIG."
          echo "::warning::Not treated as a config-schema break — most likely an unreachable RPC from this runner. Output above."

  # Fleet no-op merge guard (toon-meta#405), wired INTO this repo's aggregate
  # required check so that it blocks a HUMAN merge and not just the fleet
  # auto-merge pass (toon-meta#408). connector#1008 merged green, closed its
  # ticket and changed zero files -- and it was a human who merged it, because
  # a red NON-required check is only a warning on the merge button. This
  # replaces the stand-alone empty-pr-guard-shim.yml, deleted in the same
  # commit; running both would put two identical "No-op merge guard" check
  # runs on every PR. Canonical caller snippet and full rationale:
  # toon-meta scripts/factory/empty-pr-guard-gate-job.yml.
  #
  # No `secrets: inherit` -- the guard makes no API call and no write of any
  # kind, so handing it FACTORY_OPS_TOKEN would widen a monitored credential
  # for nothing. No `if:` either: this workflow also runs on push, where the
  # guard passes with a plain "no merge result to evaluate"; a job-level `if:`
  # would make it `skipped` there, and a skipped gating job must never read as
  # a pass (toon-meta#279).
  no-op-merge:
    uses: toon-protocol/toon-meta/.github/workflows/empty-pr-guard.yml@main

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs:
      [changeset, build, devbox-validate, solana-e2e, swap-image-build, no-op-merge]
    if: always()
    steps:
      # Fleet-wide aggregate required check (toon-meta#279): this job is the
      # single required status for the repo. It must fail unless every gating
      # job actually SUCCEEDED — a skipped or cancelled gating job must never
      # read as a pass. `build`, `devbox-validate`, `solana-e2e` and
      # `swap-image-build` carry no `if:` of their own, so for them a `skipped`
      # cannot mean "correctly not required" — only cancelled-upstream or a
      # workflow edit that stopped them running, and both must fail. That is why
      # a flat `!= success` is a complete gate for these four.
      - name: Check all gating jobs succeeded
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "devbox-validate: ${{ needs.devbox-validate.result }}"
          echo "solana-e2e: ${{ needs.solana-e2e.result }}"
          echo "swap-image-build: ${{ needs.swap-image-build.result }}"
          echo "no-op-merge: ${{ needs.no-op-merge.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.devbox-validate.result }}" != "success" ] || [ "${{ needs.solana-e2e.result }}" != "success" ] || [ "${{ needs.swap-image-build.result }}" != "success" ] || [ "${{ needs.no-op-merge.result }}" != "success" ]; then
            echo "One or more gating jobs did not succeed (failure, cancelled, and skipped all fail)."
            exit 1
          fi

      # The conditional half (swap#168, pattern from toon#217/#216). `changeset`
      # is the one job here with an `if:` of its own, so a bare `needs:` on it
      # would block NOTHING: a job skipped by its own `if:` reports `skipped`,
      # and a required check that reads a skip as a pass is not a gate. The skip
      # is therefore only accepted against the reason it exists — the event type,
      # which is not a judgement call and not something a broken step can lie
      # about.
      #
      # Three outcomes, no fourth:
      #   pull_request -> the check must have SUCCEEDED. failure, cancelled and
      #                   skipped all fail the aggregate. This is the one that
      #                   matters: it is the merge path.
      #   push         -> `skipped` is the expected result (the job's `if:`), and
      #                   `success` is fine too if someone re-ran it by hand.
      #   anything else (workflow_dispatch, a future trigger) -> treated as push:
      #                   permissive, because this workflow gates merges via
      #                   pull_request and a hand-fired run must not be able to
      #                   turn `CI OK` red for a job that was never meant to run.
      - name: The changeset check must have run and passed on a PR
        env:
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event: $EVENT_NAME"
          echo "changeset: $CHANGESET_RESULT"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$CHANGESET_RESULT" != "success" ]; then
              echo "::error::changeset result is '$CHANGESET_RESULT' on a pull_request (expected 'success'; skipped and cancelled both count as failure — the job's own 'if:' runs it on every PR, so a skip means it stopped running, not that it was unnecessary)"
              exit 1
            fi
            echo "CI OK: the changeset check ran and passed on this PR."
            exit 0
          fi
          case "$CHANGESET_RESULT" in
            success|skipped)
              echo "CI OK: changeset was '$CHANGESET_RESULT' on a '$EVENT_NAME' event, which is legitimate."
              ;;
            *)
              echo "::error::changeset result is '$CHANGESET_RESULT' on a '$EVENT_NAME' event (only 'success' or 'skipped' are legitimate off a pull_request)"
              exit 1
              ;;
          esac
          echo "All gating jobs succeeded."
